<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHEER STORE — Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap');
:root{--ink:#181614;--gold:#a98658;--bg:#f6f2ec;--line:#e4dbcf;--white:#fff;--muted:#746c63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali",sans-serif}.login{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;background:#171513;color:#fff}.loginImg{background:url('/assets/admin-login.jpg') center/cover;min-height:100vh;position:relative}.loginImg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#17151305,#171513c9)}.loginPanel{display:flex;align-items:center;justify-content:center;padding:35px}.loginBox{width:min(390px,100%);text-align:center;background:#211e1b;padding:34px 30px;border:1px solid #3b342d;border-radius:22px;box-shadow:0 25px 70px #0007}.adminLogo{width:78px;height:78px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 16px;border:2px solid var(--gold);box-shadow:0 8px 28px #0008}.mark{font:600 25px "Playfair Display",serif;letter-spacing:3px}.loginBox p{color:#bcb3a9;font-size:12px}.field{margin:14px 0}.field label{font-size:11px;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dcd1c4;border-radius:8px;font:inherit;background:#fff}.btn{border:0;background:var(--gold);color:#fff;border-radius:8px;padding:12px 17px;cursor:pointer;font-weight:700}.btn.dark{background:var(--ink)}.loginBox .btn{width:100%}.loginBox .field{text-align:left}.loginTitle{margin:0 0 4px}.loginSubtitle{margin:0 0 18px}.app{display:none;min-height:100vh}.sidebar{width:245px;background:#171513;color:#eee;position:fixed;left:0;top:0;bottom:0;padding:24px 15px}.sidebrand{font:600 23px "Playfair Display",serif;letter-spacing:2px;padding:8px 10px 28px}.side a{display:flex;gap:12px;align-items:center;color:#cfc6bc;text-decoration:none;padding:12px;border-radius:8px;font-size:12px;margin:3px 0}.side a.active,.side a:hover{background:#2b2723;color:#fff}.main{margin-left:245px;padding:28px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px}.topActions{display:flex;align-items:center;gap:10px}.langbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;font:700 10px inherit;cursor:pointer}.langbtn:hover{border-color:var(--gold);color:var(--gold)}.topbar h1{font:600 30px "Playfair Display",serif;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;border:1px solid var(--line);padding:20px;border-radius:14px}.stat b{font-size:25px}.stat small{display:block;color:var(--muted);font-size:11px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}.panel h3{margin-top:0}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:var(--muted)}.badge{padding:4px 8px;border-radius:20px;background:#eee5d9}.actions{display:flex;gap:6px}.btn.sm{padding:7px 9px;font-size:10px}.statusActions{display:flex;gap:5px;flex-wrap:wrap}.btn.confirm{background:#5b7d5b;border-color:#5b7d5b}.btn.cancel{background:#8b4b4b;border-color:#8b4b4b}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.empty{padding:35px;text-align:center;color:var(--muted)}.mobileMenu{display:none}@media(max-width:850px){.sidebar{width:210px}.main{margin-left:210px;padding:18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.login{grid-template-columns:1fr}.loginImg{display:none}.sidebar{display:none}.main{margin-left:0}.mobileMenu{display:block}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<section class="login" id="login"><div class="loginImg"></div><div class="loginPanel"><div class="loginBox"><img class="adminLogo" src="/assets/admin-login.jpg" alt="MAHEER STORE"><h1 class="mark loginTitle">MAHEER STORE</h1><p class="loginSubtitle" data-admin-i18n="adminAccess">Admin access</p><form onsubmit="adminLogin(event)"><div class="field"><label data-admin-i18n="email">Email</label><input id="aemail" type="email" required></div><div class="field"><label data-admin-i18n="password">Password</label><input id="apass" type="password" required></div><button class="btn" data-admin-i18n="login">Login</button></form><p id="loginErr"></p></div></div></section>
<section class="app" id="app"><aside class="sidebar"><div class="sidebrand">MAHEER STORE</div><nav class="side"><a href="#" data-page="dashboard">▦ Dashboard</a><a href="#" data-page="products">◫ Products</a><a href="#" data-page="orders">▤ Orders</a><a href="#" data-page="agents">♧ Agents</a><a href="#" data-page="messages">✉ Messages</a><a href="#" data-page="settings">⚙ Settings</a><a href="#" data-page="security">⌁ Security</a><a href="/" target="_blank">↗ Store</a><a href="#" onclick="logout()">⇥ Logout</a></nav></aside><main class="main"><div class="topbar"><div><button class="btn sm mobileMenu" onclick="toggleSidebar()">☰</button><h1 id="title">Dashboard</h1></div><div class="topActions"><button class="langbtn" id="adminLangBtn" onclick="toggleAdminLang()">বাংলা</button><span id="adminEmail" class="badge"></span></div></div><div id="content"></div></main></section>
<div id="toast" style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#171513;color:#fff;padding:11px 16px;border-radius:8px;display:none;font-size:12px"></div>
<script>
let token=localStorage.getItem('maheer_admin_token'),page='dashboard',cache={};
let adminLang=localStorage.getItem('maheer_admin_lang')||'en';
const adminBn={Dashboard:'ড্যাশবোর্ড',Products:'প্রোডাক্ট',Orders:'অর্ডার',Agents:'এজেন্ট',Messages:'মেসেজ',Settings:'সেটিংস',Security:'সিকিউরিটি',Store:'স্টোর',Logout:'লগআউট',Admin:'অ্যাডমিন','Admin access':'অ্যাডমিন লগইন',Email:'ইমেইল',Password:'পাসওয়ার্ড',Login:'লগইন',Confirm:'কনফার্ম',Cancel:'বাতিল',Revenue:'আয়','New messages':'নতুন মেসেজ','Store overview':'স্টোর ওভারভিউ','Add product':'প্রোডাক্ট যোগ করুন','Product name *':'প্রোডাক্টের নাম *','Category *':'ক্যাটাগরি *','Price *':'দাম *','Stock':'স্টক','Description *':'বিবরণ *','Featured':'ফিচার্ড','Product image':'প্রোডাক্ট ছবি','Save product':'প্রোডাক্ট সেভ করুন','Customer':'কাস্টমার','Total':'মোট','Payment':'পেমেন্ট','Status':'স্ট্যাটাস','Update':'আপডেট','More':'আরও','Processing':'প্রসেসিং','Shipped':'শিপড','Delivered':'ডেলিভার্ড','Add agent':'এজেন্ট যোগ করুন','Name':'নাম','Phone':'ফোন','WhatsApp number':'WhatsApp নম্বর','Contact messages':'কন্টাক্ট মেসেজ','Date':'তারিখ','Contact':'যোগাযোগ','Message':'মেসেজ','Store information':'স্টোর তথ্য','About title':'About শিরোনাম','Address':'ঠিকানা','About store':'স্টোর সম্পর্কে','Instagram link':'Instagram লিংক','Facebook link':'Facebook লিংক','WhatsApp link/number':'WhatsApp লিংক/নম্বর','TikTok link':'TikTok লিংক','Payment & delivery':'পেমেন্ট ও ডেলিভারি','Delivery inside':'ভিতরের ডেলিভারি','Delivery outside':'বাইরের ডেলিভারি','Save settings':'সেটিংস সেভ করুন','Admin password change':'Admin password পরিবর্তন','Current password':'বর্তমান password','New password':'নতুন password','Change password':'password পরিবর্তন'};
function toggleAdminLang(){adminLang=adminLang==='en'?'bn':'en';localStorage.setItem('maheer_admin_lang',adminLang);location.reload()}
function applyAdminLang(){document.documentElement.lang=adminLang==='bn'?'bn':'en';const b=$('#adminLangBtn');if(b)b.textContent=adminLang==='en'?'বাংলা':'English';document.querySelectorAll('[data-admin-i18n]').forEach(el=>{const k=el.dataset.adminI18n;el.textContent=adminLang==='bn'?(adminBn[k]||el.textContent):({adminAccess:'Admin access',email:'Email',password:'Password',login:'Login'}[k]||el.textContent)});if(adminLang==='bn'){document.querySelectorAll('.side a').forEach(a=>{const text=a.textContent.trim();for(const [en,bn] of Object.entries(adminBn)){if(text.endsWith(en)){a.textContent=text.slice(0,-en.length)+bn;break}}});const walker=document.createTreeWalker(document.querySelector('#content'),NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){const t=n.nodeValue.trim();if(adminBn[t])n.nodeValue=n.nodeValue.replace(t,adminBn[t])}}}

const $=s=>document.querySelector(s);
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:`Bearer ${token}`,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}
function logout(){localStorage.removeItem('maheer_admin_token');location.reload()}
async function adminLogin(e){e.preventDefault();try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#aemail').value,password:$('#apass').value})});const d=await r.json();if(!r.ok)throw new Error(d.error);localStorage.setItem('maheer_admin_token',d.token);token=d.token;start()}catch(x){$('#loginErr').textContent=x.message}}
function toggleSidebar(){const s=document.querySelector('.sidebar');if(!s)return;s.style.display=s.style.display==='block'?'none':'block';s.style.zIndex='200'}
function start(){if(!token)return;$('#login').style.display='none';$('#app').style.display='block';$('#adminEmail').textContent='Admin';applyAdminLang();document.querySelectorAll('.side a[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();page=a.dataset.page;document.querySelectorAll('.side a').forEach(x=>x.classList.remove('active'));a.classList.add('active');render()});document.querySelector('.side a[data-page="dashboard"]').classList.add('active');render()}
async function render(){const names={dashboard:'Dashboard',products:'Products',orders:'Orders',agents:'Agents',messages:'Messages',settings:'Settings',security:'Security'};$('#title').textContent=names[page];try{if(page==='dashboard')await dashboard();if(page==='products')await productsPage();if(page==='orders')await ordersPage();if(page==='agents')await agentsPage();if(page==='messages')await messagesPage();if(page==='settings')await settingsPage();if(page==='security')securityPage();applyAdminLang()}catch(e){$('#content').innerHTML=`<div class="panel">${e.message}</div>`}}
async function dashboard(){const d=await api('/api/admin/dashboard');$('#content').innerHTML=`<div class="grid"><div class="stat"><small>Orders</small><b>${d.orders}</b></div><div class="stat"><small>Revenue</small><b>৳${d.revenue.toLocaleString()}</b></div><div class="stat"><small>Products</small><b>${d.products}</b></div><div class="stat"><small>Agents</small><b>${d.agents}</b></div></div><div class="panel"><h3>Store overview</h3><p class="muted">New messages: ${d.newMessages}</p></div>`}
function productForm(p={}){return `<form onsubmit="saveProduct(event,${p.id||0})" enctype="multipart/form-data"><div class="formgrid"><div class="field"><label>Product name *</label><input name="name" value="${esc(p.name||'')}" required></div><div class="field"><label>Category *</label><input name="category" value="${esc(p.category||'')}" required></div><div class="field"><label>Price *</label><input name="price" type="number" min="0" step="0.01" value="${p.price||''}" required></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" value="${p.stock??50}"></div><div class="field full"><label>Description *</label><textarea name="description" required>${esc(p.description||'')}</textarea></div><div class="field"><label>Featured</label><select name="featured"><option value="0" ${!p.featured?'selected':''}>No</option><option value="1" ${p.featured?'selected':''}>Yes</option></select></div><div class="field"><label>Product image</label><input name="image" type="file" accept="image/*"></div></div><button class="btn">Save product</button></form>`}
async function productsPage(){const list=await api('/api/admin/products');cache.products=list;$('#content').innerHTML=`<div class="panel"><h3>Add product</h3>${productForm()}</div><div class="panel"><h3>Products</h3><div class="tableWrap"><table class="table"><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>${list.map(p=>`<tr><td><img src="${p.image_url}" width="45" height="45" style="object-fit:cover;border-radius:7px"></td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>৳${p.price}</td><td>${p.stock}</td><td><div class="actions"><button class="btn sm" onclick="editProduct(${p.id})">Edit</button><button class="btn sm dark" onclick="deleteProduct(${p.id})">Delete</button></div></td></tr>`).join('')}</table></div></div>`}
async function editProduct(id){const p=cache.products.find(x=>x.id===id);$('#content').scrollTo?.(0,0);showModal(productForm(p))}
function showModal(html){let d=document.createElement('div');d.id='adminModal';d.style='position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;padding:15px';d.innerHTML=`<div style="background:#fff;width:min(700px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:14px;position:relative"><button onclick="this.closest('#adminModal').remove()" style="position:absolute;right:12px;top:8px;border:0;background:none;font-size:25px">×</button>${html}</div>`;document.body.appendChild(d)}
async function saveProduct(e,id){e.preventDefault();const fd=new FormData(e.target);try{await api(id?`/api/admin/products/${id}`:'/api/admin/products',{method:id?'PUT':'POST',body:fd,headers:{Authorization:`Bearer ${token}`}});document.querySelector('#adminModal')?.remove();toast('Product saved');render()}catch(x){toast(x.message)}}
async function deleteProduct(id){if(!confirm('Product delete করবেন?'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});toast('Deleted');render()}catch(x){toast(x.message)}}
async function ordersPage(){const list=await api('/api/admin/orders');$('#content').innerHTML=`<div class="panel"><h3>Orders</h3><div class="tableWrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr>${list.map(o=>`<tr><td><b>${o.order_code}</b><br><small>${o.created_at}</small></td><td>${esc(o.customer_name)}<br>${esc(o.phone)}</td><td>৳${o.total}</td><td>${esc(o.payment_method)}<br>${esc(o.transaction_id||'')}</td><td><span class="badge">${esc(o.status)}</span><br><small>${esc(o.payment_status)}</small></td><td><div class="statusActions"><button class="btn sm confirm" onclick="updateOrder(${o.id},'Confirmed')">Confirm</button><button class="btn sm cancel" onclick="updateOrder(${o.id},'Cancelled')">Cancel</button><select onchange="updateOrder(${o.id},this.value)"><option value="">More</option><option>Processing</option><option>Shipped</option><option>Delivered</option></select></div></td></tr>`).join('')}</table></div></div>`}
async function updateOrder(id,status){if(!status)return;try{await api('/api/admin/orders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});toast(status==='Confirmed'?'Order confirmed':status==='Cancelled'?'Order cancelled':'Order updated');await ordersPage();applyAdminLang()}catch(x){toast(x.message)}}
async function agentsPage(){const list=await api('/api/admin/agents');cache.agents=list;$('#content').innerHTML=`<div class="panel"><h3>Add agent</h3><form onsubmit="saveAgent(event)"><div class="formgrid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>WhatsApp number</label><input name="whatsapp" placeholder="8801XXXXXXXXX"></div></div><button class="btn">Add agent</button></form></div><div class="panel"><h3>Agents</h3>${list.length?list.map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)"><span><b>${esc(a.name)}</b><br><small>${esc(a.phone)}</small></span><span class="actions"><button class="btn sm" onclick="editAgent(${a.id})">Edit</button><button class="btn sm dark" onclick="deleteAgent(${a.id})">Delete</button></span></div>`).join(''):'<div class="empty">কোনো agent নেই</div>'}</div>`}
async function saveAgent(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());try{await api(id?'/api/admin/agents/'+id:'/api/admin/agents',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.querySelector('#adminModal')?.remove();toast('Agent saved');render()}catch(x){toast(x.message)}}
function editAgent(id){const a=cache.agents.find(x=>x.id===id);showModal(`<h3>Edit agent</h3><form onsubmit="saveAgent(event,${id})"><div class="field"><label>Name</label><input name="name" value="${esc(a.name)}" required></div><div class="field"><label>Phone</label><input name="phone" value="${esc(a.phone)}" required></div><div class="field"><label>WhatsApp</label><input name="whatsapp" value="${esc(a.whatsapp||'')}"></div><button class="btn">Save</button></form>`)}
async function deleteAgent(id){if(!confirm('Agent delete করবেন?'))return;await api('/api/admin/agents/'+id,{method:'DELETE'});render()}
async function messagesPage(){const list=await api('/api/admin/messages');$('#content').innerHTML=`<div class="panel"><h3>Contact messages</h3>${list.length?`<div class="tableWrap"><table class="table"><tr><th>Date</th><th>Name</th><th>Contact</th><th>Message</th><th>Status</th></tr>${list.map(m=>`<tr><td>${m.created_at}</td><td>${esc(m.name)}</td><td>${esc(m.phone||'')}<br>${esc(m.email||'')}</td><td style="white-space:normal;min-width:260px">${esc(m.message)}</td><td><select onchange="markMessage(${m.id},this.value)"><option ${m.status==='New'?'selected':''}>New</option><option ${m.status==='Read'?'selected':''}>Read</option></select></td></tr>`).join('')}</table></div>`:'<div class="empty">কোনো message নেই</div>'}</div>`}
async function markMessage(id,status){await api('/api/admin/messages/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})})}
async function settingsPage(){const s=await api('/api/admin/settings');cache.settings=s;$('#content').innerHTML=`<div class="panel"><h3>Store information</h3><form onsubmit="saveSettings(event)"><div class="formgrid"><div class="field"><label>About title</label><input name="about_title" value="${esc(s.about_title||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(s.phone||'')}"></div><div class="field"><label>Email</label><input name="email" value="${esc(s.email||'')}"></div><div class="field"><label>Address</label><input name="address" value="${esc(s.address||'')}"></div><div class="field full"><label>About store</label><textarea name="about_text">${esc(s.about_text||'')}</textarea></div><div class="field"><label>Instagram link</label><input name="instagram" value="${esc(s.instagram||'')}"></div><div class="field"><label>Facebook link</label><input name="facebook" value="${esc(s.facebook||'')}"></div><div class="field"><label>WhatsApp link/number</label><input name="whatsapp" value="${esc(s.whatsapp||'')}"></div><div class="field"><label>TikTok link</label><input name="tiktok" value="${esc(s.tiktok||'')}"></div></div><h3>Payment & delivery</h3><div class="formgrid"><div class="field"><label>bKash</label><input name="bkash" value="${esc(s.bkash||'')}"></div><div class="field"><label>Nagad</label><input name="nagad" value="${esc(s.nagad||'')}"></div><div class="field"><label>Rocket</label><input name="rocket" value="${esc(s.rocket||'')}"></div><div class="field"><label>Delivery inside</label><input name="delivery_inside" value="${esc(s.delivery_inside||'')}"></div><div class="field"><label>Delivery outside</label><input name="delivery_outside" value="${esc(s.delivery_outside||'')}"></div></div><button class="btn">Save settings</button></form></div>`}
async function saveSettings(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());try{await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});toast('Settings saved')}catch(x){toast(x.message)}}
function securityPage(){$('#content').innerHTML=`<div class="panel"><h3>Admin password change</h3><form onsubmit="changePass(event)" style="max-width:500px"><div class="field"><label>Current password</label><input name="currentPassword" type="password" required></div><div class="field"><label>New password</label><input name="newPassword" type="password" minlength="8" required></div><button class="btn">Change password</button></form></div>`}
async function changePass(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());try{await api('/api/admin/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});toast('Password changed')}catch(x){toast(x.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
applyAdminLang();if(token)start();
</script></body></html>
