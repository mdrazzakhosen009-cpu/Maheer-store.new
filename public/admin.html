<!-- অ্যাডমিন প্যানেলে কাস্টমার রিভিউ পিক আপলোড করার ফর্ম -->
<div class="admin-review-box" style="background: #fff; padding: 20px; border-radius: 8px; margin-top: 20px;">
    <h3>কাস্টমার রিভিউ পিক আপলোড</h3>
    <form id="adminReviewForm">
        <div style="margin-bottom: 10px;">
            <label>গ্রাহকের নাম:</label>
            <input type="text" id="adminCustName" required placeholder="নাম লিখুন" style="width: 100%; padding: 8px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>ছবির ফাইলের নাম বা লিংক:</label>
            <input type="text" id="adminImgLink" required placeholder="review-2.jpg" style="width: 100%; padding: 8px;">
        </div>
        <button type="submit" style="background: #C5A059; color: #fff; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold;">রিভিউ পিক আপলোড করুন</button>
    </form>
</div>

<script>
    document.getElementById('adminReviewForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('adminCustName').value;
        const image = document.getElementById('adminImgLink').value;

        const response = await fetch('/api/reviews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, image })
        });

        if(response.ok) {
            alert('রিভিউ পিক সফলভাবে আপলোড হয়েছে!');
            document.getElementById('adminReviewForm').reset();
        } else {
            alert('আপলোড করতে সমস্যা হয়েছে।');
        }
    });
</script>
