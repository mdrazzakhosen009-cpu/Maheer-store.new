<!-- ৪. কাস্টমার রিভিউ ডিসপ্লে সেকশন -->
<div class="customer-reviews-section">
    <h2>কাস্টমার রিভিউ</h2>
    <div id="reviewDisplayContainer" style="display: flex; gap: 15px; flex-wrap: wrap;"></div>
</div>

<!-- ৫. চ্যাটবট নিজে অর্ডার নেওয়ার লজিক (JavaScript) -->
<script>
    // চ্যাটবটের মাধ্যমে সরাসরি অর্ডার গ্রহণের ফাংশন
    function processChatOrder(userMessage) {
        if(userMessage.includes('অর্ডার') || userMessage.toLowerCase().includes('order')) {
            return "আপনার অর্ডারটি গ্রহণ করা হয়েছে! দয়া করে আপনার নাম, মোবাইল নাম্বার এবং সম্পূর্ণ ঠিকানা দিন।";
        }
        return "স্বাগতম! আপনি কোন প্রোডাক্টটি নিতে চান বা অর্ডার করতে চান তা এখানে লিখে জানান। চ্যাটবট স্বয়ংক্রিয়ভাবে আপনার অর্ডার নিয়ে নেবে।";
    }

    // ডাইনামিক রিভিউ লোড করার কোড
    async function fetchReviews() {
        try {
            const res = await fetch('/api/reviews');
            const data = await res.json();
            const container = document.getElementById('reviewDisplayContainer');
            if(container) {
                container.innerHTML = data.map(r => `
                    <div style="border: 1px solid #ddd; padding: 10px; border-radius: 5px; text-align: center;">
                        <img src="${r.image}" alt="Review" style="width: 100px; height: 100px; object-fit: cover;">
                        <p>${r.name}</p>
                    </div>
                `).join('');
            }
        } catch(e) { console.error(e); }
    }
    fetchReviews();
</script>
